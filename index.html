<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Ask Anything AI</title>

<style>
*{box-sizing:border-box}

html,body{
  margin:0;
  width:100%;
  height:100%;
  background:#09080d;
  color:#f7f5fa;
  font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

body{
  overflow:hidden;
}

.app{
  display:flex;
  width:100%;
  height:100vh;
}

.sidebar{
  width:255px;
  background:#111016;
  border-right:1px solid #292532;
  padding:18px;
  display:flex;
  flex-direction:column;
}

.logo{
  font-size:20px;
  font-weight:750;
  margin-bottom:18px;
}

.new{
  background:#1a1720;
  color:#fff;
  border:1px solid #35303d;
  border-radius:12px;
  padding:12px;
  cursor:pointer;
  text-align:left;
}

.history{
  flex:1;
  overflow:auto;
  margin-top:18px;
}

.history h4{
  color:#817a8b;
  font-size:11px;
  margin:10px 4px;
  text-transform:uppercase;
}

.chat-item{
  padding:9px 10px;
  border-radius:9px;
  font-size:13px;
  color:#c9c4cf;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  cursor:pointer;
}

.chat-item:hover{
  background:#201b25;
}

.sidebar-footer{
  color:#68616f;
  font-size:11px;
}

main{
  flex:1;
  min-width:0;
  display:flex;
  flex-direction:column;
}

.topbar{
  height:60px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 22px;
  border-bottom:1px solid #292532;
  background:#0d0c11;
}

.model{
  font-weight:650;
}

.badge{
  border:1px solid #393340;
  color:#9b94a4;
  border-radius:999px;
  padding:5px 9px;
  font-size:11px;
}

.messages{
  flex:1;
  overflow-y:auto;
  padding:30px 18px 150px;
  scroll-behavior:smooth;
}

.wrap{
  width:100%;
  max-width:850px;
  margin:auto;
}

.welcome{
  text-align:center;
  margin:14vh auto 30px;
}

.welcome h1{
  font-size:40px;
  margin:0 0 10px;
}

.welcome p{
  color:#8c8694;
}

/* NORMAL COMPACT MESSAGES */

.msg{
  display:flex;
  align-items:flex-start;
  gap:10px;
  margin:0 0 22px;
  line-height:1.55;
  font-size:15px;
  width:100%;
}

.avatar{
  width:30px;
  height:30px;
  flex:0 0 30px;
  border-radius:9px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#24202a;
  font-size:11px;
}

.user .avatar{
  background:#40374a;
}

.bubble{
  max-width:min(720px,80%);
  min-width:0;
  white-space:pre-wrap;
  overflow-wrap:anywhere;
  padding:2px 0;
}

/* User messages are compact */

.user .bubble{
  background:#19161e;
  border:1px solid #302a35;
  border-radius:14px;
  padding:9px 13px;
}

/* Attachments */

.image-message{
  display:block;
  max-width:280px;
  max-height:280px;
  margin-top:9px;
  border-radius:11px;
  border:1px solid #39323f;
  object-fit:contain;
}

.pdf-card{
  display:flex;
  align-items:center;
  gap:9px;
  margin-top:9px;
  padding:9px 11px;
  background:#17141c;
  border:1px solid #39323f;
  border-radius:11px;
  max-width:300px;
}

.pdf-icon{
  font-size:23px;
}

.pdf-name{
  font-size:12px;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

/* Composer */

.composer-area{
  position:fixed;
  left:255px;
  right:0;
  bottom:0;
  padding:15px 18px 22px;
  background:linear-gradient(transparent,#09080d 28%);
}

.composer{
  max-width:850px;
  margin:auto;
  background:#151219;
  border:1px solid #38313f;
  border-radius:17px;
  padding:8px;
}

.composer-row{
  display:flex;
  align-items:flex-end;
  gap:7px;
}

textarea{
  flex:1;
  min-height:43px;
  max-height:150px;
  padding:9px;
  resize:none;
  border:0;
  outline:0;
  background:transparent;
  color:#fff;
  font:inherit;
}

.tool{
  width:42px;
  height:42px;
  border-radius:12px;
  border:1px solid #38313f;
  background:#211d27;
  color:#fff;
  font-size:17px;
  cursor:pointer;
}

.tool:hover{
  background:#2c2532;
}

.send{
  width:42px;
  height:42px;
  border:0;
  border-radius:12px;
  background:#fff;
  color:#111;
  font-size:18px;
  cursor:pointer;
}

.send:disabled{
  opacity:.35;
}

.attachments{
  display:none;
  gap:7px;
  flex-wrap:wrap;
  padding:5px;
}

.attachment{
  position:relative;
  border:1px solid #39323f;
  border-radius:10px;
  overflow:hidden;
}

.attachment img{
  width:70px;
  height:70px;
  object-fit:cover;
  display:block;
}

.pdf-preview{
  width:170px;
  padding:9px;
  display:flex;
  align-items:center;
  gap:8px;
}

.remove{
  position:absolute;
  right:3px;
  top:3px;
  width:20px;
  height:20px;
  border:0;
  border-radius:50%;
  background:#fff;
  color:#111;
  cursor:pointer;
}

.hint{
  text-align:center;
  color:#65606c;
  font-size:10px;
  margin-top:7px;
}

/* VOICE */

.voice-overlay{
  position:fixed;
  inset:0;
  z-index:1000;
  display:none;
  align-items:center;
  justify-content:center;
  background:
    radial-gradient(circle at center,#21132f 0%,#0a090e 42%,#040406 100%);
}

.voice-overlay.active{
  display:flex;
}

.voice-title{
  position:absolute;
  top:34px;
  font-size:18px;
  font-weight:650;
}

.voice-status{
  position:absolute;
  top:67px;
  color:#a59eae;
  font-size:13px;
}

.globe{
  width:250px;
  height:250px;
  border-radius:50%;
  background:
    radial-gradient(
      circle at 33% 25%,
      #fff 0%,
      #fff 9%,
      #f3e8ff 20%,
      #d6aaff 35%,
      #984cff 52%,
      #6519ad 72%,
      #250633 100%
    );

  box-shadow:
    0 0 28px #d5a2ff,
    0 0 65px #a64dff88,
    inset -28px -25px 50px #21032f,
    inset 18px 15px 40px #ffffffbb;

  will-change:transform,box-shadow;
  animation:float 4s ease-in-out infinite;
}

.globe.listening{
  animation:listen .9s ease-in-out infinite;
  box-shadow:
    0 0 40px #e0b7ff,
    0 0 100px #a94cffaa,
    inset -28px -25px 50px #21032f,
    inset 18px 15px 40px #ffffffcc;
}

.globe.thinking{
  animation:think 1.3s ease-in-out infinite;
}

.globe.speaking{
  animation:speak .65s ease-in-out infinite;
  box-shadow:
    0 0 45px #fff,
    0 0 110px #b967ffcc,
    inset -28px -25px 50px #21032f,
    inset 18px 15px 40px #ffffffdd;
}

@keyframes float{
  0%,100%{transform:translateY(0) scale(1)}
  50%{transform:translateY(-8px) scale(1.015)}
}

@keyframes listen{
  0%,100%{transform:scale(1)}
  50%{transform:scale(1.07)}
}

@keyframes think{
  0%,100%{transform:scale(1) rotate(0deg)}
  50%{transform:scale(1.035) rotate(3deg)}
}

@keyframes speak{
  0%,100%{transform:scale(1)}
  50%{transform:scale(1.09)}
}

.voice-controls{
  position:absolute;
  bottom:45px;
  display:flex;
  gap:18px;
}

.voice-btn{
  width:58px;
  height:58px;
  border-radius:50%;
  border:1px solid #ffffff25;
  background:#ffffff12;
  color:#fff;
  font-size:22px;
  cursor:pointer;
  backdrop-filter:blur(10px);
}

.voice-btn.mic{
  background:#fff;
  color:#111;
}

/* Mobile */

@media(max-width:700px){

  .sidebar{
    display:none;
  }

  .composer-area{
    left:0;
  }

  .topbar{
    padding:0 15px;
  }

  .welcome h1{
    font-size:31px;
  }

  .messages{
    padding-left:12px;
    padding-right:12px;
  }

  .bubble{
    max-width:86%;
  }

  .globe{
    width:215px;
    height:215px;
  }
}
</style>
</head>

<body>

<div class="app">

<aside class="sidebar">

<div class="logo">✦ Ask Anything AI</div>

<button class="new" onclick="newChat()">
＋ New chat
</button>

<div class="history">

<h4>Recent chats</h4>

<div id="history"></div>

</div>

<div class="sidebar-footer">
Your AI assistant
</div>

</aside>

<main>

<header class="topbar">

<div class="model">
Ask Anything <span class="badge">AI</span>
</div>

<div class="badge" id="status">
Connected
</div>

</header>

<section class="messages" id="messages">

<div class="wrap" id="chat"></div>

</section>

<div class="composer-area">

<div class="composer">

<div class="attachments" id="attachments"></div>

<div class="composer-row">

<textarea
id="input"
placeholder="Ask anything…"
rows="1"
></textarea>

<input
id="imageInput"
type="file"
accept="image/*"
multiple
hidden
>

<input
id="pdfInput"
type="file"
accept="application/pdf"
hidden
>

<button
class="tool"
onclick="imageInput.click()"
title="Photo"
>
📷
</button>

<button
class="tool"
onclick="pdfInput.click()"
title="PDF"
>
📄
</button>

<button
class="tool"
onclick="openVoice()"
title="Voice"
>
🎙️
</button>

<button
class="send"
id="send"
onclick="sendMessage()"
>
↑
</button>

</div>

</div>

<div class="hint">
Enter to send · Shift+Enter for new line · 📷 Photo · 📄 PDF · 🎙️ Voice
</div>

</div>

</main>

</div>

<!-- VOICE SCREEN -->

<div class="voice-overlay" id="voiceOverlay">

<div class="voice-title">
Ask Anything AI
</div>

<div class="voice-status" id="voiceStatus">
Tap the microphone
</div>

<div
class="globe"
id="globe"
></div>

<div class="voice-controls">

<button
class="voice-btn"
onclick="closeVoice()"
>
×
</button>

<button
class="voice-btn mic"
id="voiceMic"
onclick="toggleVoice()"
>
🎙️
</button>

</div>

</div>

<script>

const chat=document.getElementById("chat");
const messagesBox=document.getElementById("messages");
const input=document.getElementById("input");
const send=document.getElementById("send");

const imageInput=document.getElementById("imageInput");
const pdfInput=document.getElementById("pdfInput");
const attachments=document.getElementById("attachments");

const voiceOverlay=document.getElementById("voiceOverlay");
const voiceStatus=document.getElementById("voiceStatus");
const globe=document.getElementById("globe");

let messages=[];

let chats=JSON.parse(
localStorage.getItem("ask-anything-chats")||"[]"
);

let selectedFiles=[];

let recognition=null;
let listening=false;
let voiceBusy=false;

/* ---------- HELPERS ---------- */

function escapeHtml(s){

return String(s).replace(
/[&<>"']/g,
m=>({
"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;",
"'":"&#039;"
}[m])
);

}

function scrollBottom(){

requestAnimationFrame(()=>{
messagesBox.scrollTop=
messagesBox.scrollHeight;
});

}

/* ---------- CHAT ---------- */

function newChat(){

messages=[];

selectedFiles=[];

renderAttachments();

chat.innerHTML=`

<div class="welcome">

<h1>What can I help you with?</h1>

<p>
Ask anything, upload a photo or PDF,
or talk with your AI assistant.
</p>

</div>

`;

}

function addMessage(role,text,files=[]){

if(document.querySelector(".welcome")){
chat.innerHTML="";
}

const el=document.createElement("div");

el.className="msg "+role;

const avatar=
role==="user"?"You":"✦";

let fileHtml="";

for(const file of files){

if(file.type==="image"){

fileHtml+=`
<img
class="image-message"
src="${file.data}"
>
`;

}else{

fileHtml+=`

<div class="pdf-card">

<div class="pdf-icon">📄</div>

<div class="pdf-name">
${escapeHtml(file.name)}
</div>

</div>

`;

}

}

el.innerHTML=`

<div class="avatar">
${avatar}
</div>

<div class="bubble">
${escapeHtml(text)}
${fileHtml}
</div>

`;

chat.appendChild(el);

scrollBottom();

return el;
}

/* ---------- FILES ---------- */

function fileToDataURL(file){

return new Promise((resolve,reject)=>{

const reader=new FileReader();

reader.onload=()=>{
resolve(reader.result);
};

reader.onerror=reject;

reader.readAsDataURL(file);

});

}

imageInput.onchange=async()=>{

for(const file of imageInput.files){

if(!file.type.startsWith("image/")){
continue;
}

if(file.size>10*1024*1024){
alert("Image must be under 10 MB.");
continue;
}

selectedFiles.push({

type:"image",
name:file.name,
mime:file.type,
data:await fileToDataURL(file)

});

}

imageInput.value="";

renderAttachments();

};

pdfInput.onchange=async()=>{

const file=pdfInput.files[0];

if(!file){
return;
}

if(file.size>20*1024*1024){

alert("PDF must be under 20 MB.");

pdfInput.value="";

return;
}

selectedFiles.push({

type:"pdf",
name:file.name,
mime:"application/pdf",
data:await fileToDataURL(file)

});

pdfInput.value="";

renderAttachments();

};

function renderAttachments(){

if(!selectedFiles.length){

attachments.style.display="none";
attachments.innerHTML="";

return;

}

attachments.style.display="flex";

attachments.innerHTML=
selectedFiles.map((file,i)=>{

if(file.type==="image"){

return`

<div class="attachment">

<img src="${file.data}">

<button
class="remove"
onclick="removeFile(${i})"
>
×
</button>

</div>

`;

}

return`

<div class="attachment">

<div class="pdf-preview">

<span>📄</span>

<span class="pdf-name">
${escapeHtml(file.name)}
</span>

</div>

<button
class="remove"
onclick="removeFile(${i})"
>
×
</button>

</div>

`;

}).join("");

}

function removeFile(i){

selectedFiles.splice(i,1);

renderAttachments();

}

/* ---------- NORMAL CHAT SEND ---------- */

async function sendMessage(){

const text=input.value.trim();

if(
(!text&&!selectedFiles.length)||
send.disabled
){
return;
}

const files=[...selectedFiles];

input.value="";
input.style.height="auto";

messages.push({

role:"user",
content:text||"Please analyze the attached file.",
attachments:files

});

addMessage(
"user",
text||"Please analyze the attached file.",
files
);

selectedFiles=[];

renderAttachments();

send.disabled=true;

const thinking=addMessage(
"assistant",
""
);

thinking.querySelector(".bubble").innerHTML=
`<span style="color:#8d8794">Thinking…</span>`;

try{

const response=await fetch("/api/chat",{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({
messages:messages
})

});

if(!response.ok){
throw new Error("AI error");
}

const data=await response.json();

thinking.querySelector(".bubble").textContent=
data.answer||"No answer returned.";

messages.push({

role:"assistant",
content:data.answer||""

});

saveChat(text||files[0]?.name||"New chat");

document.getElementById("status").textContent=
"Connected";

}catch(error){

console.error(error);

thinking.querySelector(".bubble").textContent=
"Sorry, I couldn't process that right now.";

}

send.disabled=false;

}

/* ---------- VOICE MODE ---------- */

function openVoice(){

voiceOverlay.classList.add("active");

voiceStatus.textContent=
"Tap the microphone";

setGlobe("");

}

function closeVoice(){

stopListening();

speechSynthesis.cancel();

voiceBusy=false;

voiceOverlay.classList.remove("active");

setGlobe("");

}

function setGlobe(state){

globe.classList.remove(
"listening",
"thinking",
"speaking"
);

if(state){
globe.classList.add(state);
}

}

function createRecognition(){

const SpeechRecognition=
window.SpeechRecognition||
window.webkitSpeechRecognition;

if(!SpeechRecognition){

alert(
"Voice recognition isn't supported by this browser."
);

return null;

}

const r=new SpeechRecognition();

r.lang="en-US";

r.continuous=false;

r.interimResults=false;

r.maxAlternatives=1;

r.onstart=()=>{

listening=true;

voiceStatus.textContent=
"Listening…";

setGlobe("listening");

};

r.onresult=async event=>{

const spoken=
event.results[0][0].transcript.trim();

listening=false;

setGlobe("thinking");

voiceStatus.textContent=
"Thinking…";

await voiceAsk(spoken);

};

r.onerror=error=>{

console.error(error);

listening=false;

voiceStatus.textContent=
"Tap the microphone";

setGlobe("");

};

r.onend=()=>{

listening=false;

};

return r;

}

function toggleVoice(){

if(voiceBusy){
return;
}

if(listening){

stopListening();

return;

}

recognition=createRecognition();

if(!recognition){
return;
}

try{

recognition.start();

}catch(e){

console.error(e);

}

}

function stopListening(){

if(recognition){

try{
recognition.stop();
}catch(e){}

}

listening=false;

setGlobe("");

}

/* ---------- DIRECT VOICE AI ---------- */

async function voiceAsk(text){

voiceBusy=true;

try{

/*
  Keep the voice conversation in memory,
  but don't force the user back into chat.
*/

messages.push({

role:"user",
content:text

});

const response=await fetch("/api/chat",{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({
messages:messages
})

});

if(!response.ok){

throw new Error("AI request failed");

}

const data=await response.json();

const answer=
data.answer||
"Sorry, I couldn't answer that.";

messages.push({

role:"assistant",
content:answer

});

/*
  Also put it into normal chat history
  without opening the chat screen.
*/

saveChat(text);

/*
  Speak immediately.
*/

voiceStatus.textContent=
"Speaking…";

setGlobe("speaking");

await speak(answer);

voiceStatus.textContent=
"Tap the microphone";

setGlobe("");

}catch(error){

console.error(error);

voiceStatus.textContent=
"Something went wrong";

setGlobe("");

}

voiceBusy=false;

}

/* ---------- SPEECH ---------- */

function getVoice(){

const voices=
speechSynthesis.getVoices();

const english=
voices.filter(v=>
/^en(-|_)/i.test(v.lang)
);

const preferred=[

"Daniel",
"Alex",
"Aaron",
"Arthur",
"Google UK English Male",
"Microsoft David",
"Microsoft Mark",
"Microsoft Guy"

];

for(const name of preferred){

const found=
english.find(v=>
v.name.toLowerCase()
.includes(name.toLowerCase())
);

if(found){
return found;
}

}

return english[0]||null;

}

function speak(text){

return new Promise(resolve=>{

speechSynthesis.cancel();

const u=
new SpeechSynthesisUtterance(text);

u.lang="en-US";

u.rate=1;

u.pitch=.88;

const voice=getVoice();

if(voice){
u.voice=voice;
}

u.onend=()=>{

setGlobe("");

resolve();

};

u.onerror=()=>{

setGlobe("");

resolve();

};

speechSynthesis.speak(u);

});

}

/* ---------- HISTORY ---------- */

function saveChat(title){

if(!messages.length){
return;
}

const clean=
messages.map(m=>({

role:m.role,
content:m.content

}));

chats.push({

title:title.slice(0,42),
messages:clean

});

chats=chats.slice(-20);

localStorage.setItem(
"ask-anything-chats",
JSON.stringify(chats)
);

renderHistory();

}

function renderHistory(){

document.getElementById("history").innerHTML=
chats
.slice(-12)
.reverse()
.map((x,i)=>`

<div
class="chat-item"
onclick="loadChat(${chats.length-1-i})"
>
${escapeHtml(x.title)}
</div>

`)
.join("");

}

function loadChat(i){

const c=chats[i];

if(!c){
return;
}

messages=c.messages||[];

chat.innerHTML="";

for(const m of messages){

addMessage(
m.role,
m.content
);

}

}

/* ---------- INPUT ---------- */

input.addEventListener("keydown",e=>{

if(
e.key==="Enter"&&!e.shiftKey
){

e.preventDefault();

sendMessage();

}

});

input.addEventListener("input",()=>{

input.style.height="auto";

input.style.height=
Math.min(
input.scrollHeight,
150
)+"px";

});

if("speechSynthesis" in window){

speechSynthesis.onvoiceschanged=()=>{
speechSynthesis.getVoices();
};

}

renderHistory();

newChat();

</script>

</body>
</html>
