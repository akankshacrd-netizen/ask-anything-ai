<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ask Anything AI</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#0b0d10;color:#f4f4f5;height:100vh;overflow:hidden}
.app{display:flex;height:100vh}.sidebar{width:270px;background:#111318;border-right:1px solid #252932;padding:18px;display:flex;flex-direction:column;gap:16px}
.logo{font-size:20px;font-weight:750;padding:8px 4px}.new{border:1px solid #30343d;background:#191c22;color:#fff;border-radius:12px;padding:12px 14px;font-size:14px;cursor:pointer;text-align:left}.new:hover{background:#20242b}
.history{flex:1;overflow:auto}.history h4{color:#8e949f;font-size:11px;text-transform:uppercase;letter-spacing:.08em;margin:12px 5px}.chat-item{padding:10px;border-radius:9px;color:#cfd2d8;font-size:13px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.chat-item:hover{background:#1b1e24}
.sidebar-footer{font-size:12px;color:#777e89;padding:4px}
main{flex:1;display:flex;flex-direction:column;min-width:0}.topbar{height:60px;border-bottom:1px solid #252932;display:flex;align-items:center;justify-content:space-between;padding:0 24px;background:#0d0f13}.model{font-weight:650}.badge{font-size:11px;color:#9aa1ad;border:1px solid #30343d;border-radius:999px;padding:5px 9px}
.messages{flex:1;overflow:auto;padding:30px 16px 150px}.wrap{max-width:850px;margin:auto}.welcome{text-align:center;margin:13vh auto 30px}.welcome h1{font-size:42px;margin:0 0 12px;letter-spacing:-.04em}.welcome p{color:#8e949f;font-size:16px}
.msg{display:flex;gap:13px;margin:0 auto 25px;line-height:1.65;font-size:15px}.avatar{width:30px;height:30px;border-radius:9px;background:#22262e;display:flex;align-items:center;justify-content:center;font-size:13px;flex:0 0 auto}.user .avatar{background:#394150}.bubble{max-width:760px;white-space:pre-wrap;word-wrap:break-word}.user .bubble{background:#171a20;border:1px solid #292e37;padding:10px 13px;border-radius:13px}
.composer-area{position:fixed;bottom:0;left:270px;right:0;padding:18px 20px 24px;background:linear-gradient(transparent,#0b0d10 25%)}.composer{max-width:850px;margin:auto;background:#15181e;border:1px solid #343943;border-radius:17px;display:flex;align-items:flex-end;padding:9px 10px;box-shadow:0 8px 35px #0008}.composer textarea{flex:1;background:transparent;border:0;outline:0;color:#fff;resize:none;min-height:45px;max-height:180px;padding:9px;font:inherit}.send{width:42px;height:42px;border:0;border-radius:12px;background:#fff;color:#111;cursor:pointer;font-size:18px}.send:disabled{opacity:.35;cursor:not-allowed}.hint{text-align:center;color:#666d77;font-size:11px;margin-top:8px}
.typing{color:#8e949f}.dot{animation:blink 1s infinite}.dot:nth-child(2){animation-delay:.2s}.dot:nth-child(3){animation-delay:.4s}@keyframes blink{50%{opacity:.2}}
@media(max-width:700px){.sidebar{display:none}.composer-area{left:0}.topbar{padding:0 16px}.welcome h1{font-size:32px}.messages{padding-left:12px;padding-right:12px}}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar">
  <div class="logo">✦ Ask Anything AI</div>
  <button class="new" onclick="newChat()">＋ New chat</button>
  <div class="history"><h4>Recent chats</h4><div id="history"></div></div>
  <div class="sidebar-footer">Your AI assistant · Local demo</div>
</aside>
<main>
  <header class="topbar"><div class="model">Ask Anything <span class="badge">AI</span></div><div class="badge" id="status">Demo mode</div></header>
  <section class="messages" id="messages"><div class="wrap" id="chat"></div></section>
  <div class="composer-area">
    <div class="composer">
      <textarea id="input" rows="1" placeholder="Ask anything…"></textarea>
      <button class="send" id="send" onclick="sendMessage()">↑</button>
    </div>
    <div class="hint">Enter to send · Shift+Enter for a new line</div>
  </div>
</main>
</div>
<script>
const chat=document.getElementById('chat'), input=document.getElementById('input'), send=document.getElementById('send');
let messages=[], chats=JSON.parse(localStorage.getItem('ask-anything-chats')||'[]');

function renderHistory(){document.getElementById('history').innerHTML=chats.slice(-12).reverse().map((x,i)=>`<div class="chat-item" onclick="loadChat(${chats.length-1-i})">${escapeHtml(x.title)}</div>`).join('')}
function escapeHtml(s){return s.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function newChat(){messages=[];chat.innerHTML=`<div class="welcome"><h1>What can I help you with?</h1><p>Ask questions, brainstorm ideas, learn something new, or get help with a task.</p></div>`}
function addMessage(role,text){if(document.querySelector('.welcome')) chat.innerHTML='';const el=document.createElement('div');el.className='msg '+role;el.innerHTML=`<div class="avatar">${role==='user'?'You':'✦'}</div><div class="bubble">${escapeHtml(text)}</div>`;chat.appendChild(el);document.getElementById('messages').scrollTop=999999}
async function sendMessage(){
 const text=input.value.trim(); if(!text||send.disabled)return;
 input.value=''; input.style.height='auto'; messages.push({role:'user',content:text}); addMessage('user',text); send.disabled=true;
 const typing=document.createElement('div');typing.className='msg assistant';typing.innerHTML='<div class="avatar">✦</div><div class="bubble typing">Thinking <span class="dot">•</span><span class="dot">•</span><span class="dot">•</span></div>';chat.appendChild(typing);
 try{
   // Replace the URL below with your own backend endpoint.
   const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages})});
   if(!r.ok) throw new Error('Backend not connected');
   const data=await r.json(); typing.remove(); const answer=data.answer||'No answer returned.'; messages.push({role:'assistant',content:answer}); addMessage('assistant',answer); saveChat(text);
   document.getElementById('status').textContent='Connected';
 }catch(e){
   typing.remove();
   const demo="Your website is ready, but the AI backend is not connected yet. Connect /api/chat to an AI model (for example an OpenAI-compatible API) and this chat will answer real questions.";
   messages.push({role:'assistant',content:demo}); addMessage('assistant',demo);
   document.getElementById('status').textContent='Backend needed';
 }
 send.disabled=false; input.focus();
}
function saveChat(first){if(!messages.length)return;chats.push({title:first.slice(0,42),messages});chats=chats.slice(-20);localStorage.setItem('ask-anything-chats',JSON.stringify(chats));renderHistory()}
function loadChat(i){const c=chats[i];if(!c)return;messages=c.messages||[];chat.innerHTML='';messages.forEach(m=>addMessage(m.role==='user'?'user':'assistant',m.content))}
input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMessage()}});
input.addEventListener('input',()=>{input.style.height='auto';input.style.height=Math.min(input.scrollHeight,180)+'px'});
renderHistory();newChat();
</script>
</body>
</html>
