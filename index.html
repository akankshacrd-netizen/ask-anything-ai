<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<title>Ask Anything AI</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  background:#09080d;
  color:#f7f5fa;
  font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

body{
  overflow:hidden;
}

button,
textarea{
  font:inherit;
}

button{
  touch-action:manipulation;
}

.app{
  display:flex;
  width:100%;
  height:100dvh;
}

.sidebar{
  width:255px;
  background:#111016;
  border-right:1px solid #292532;
  padding:18px;
  display:flex;
  flex-direction:column;
}

.logo{
  font-size:20px;
  font-weight:750;
  margin-bottom:18px;
}

.new{
  background:#1a1720;
  color:#fff;
  border:1px solid #35303d;
  border-radius:12px;
  padding:12px;
  cursor:pointer;
  text-align:left;
}

.history{
  flex:1;
  overflow:auto;
  margin-top:18px;
}

.history h4{
  color:#817a8b;
  font-size:11px;
  margin:10px 4px;
  text-transform:uppercase;
}

.chat-item{
  padding:9px 10px;
  border-radius:9px;
  font-size:13px;
  color:#c9c4cf;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  cursor:pointer;
}

.chat-item:hover{
  background:#201b25;
}

.sidebar-footer{
  color:#68616f;
  font-size:11px;
}

main{
  flex:1;
  min-width:0;
  display:flex;
  flex-direction:column;
}

.topbar{
  height:60px;
  flex:0 0 60px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 22px;
  border-bottom:1px solid #292532;
  background:#0d0c11;
}

.model{
  font-weight:650;
}

.badge{
  border:1px solid #393340;
  color:#9b94a4;
  border-radius:999px;
  padding:5px 9px;
  font-size:11px;
}

.messages{
  flex:1;
  overflow-y:auto;
  -webkit-overflow-scrolling:touch;
  padding:30px 18px 150px;
  scroll-behavior:smooth;
}

.wrap{
  width:100%;
  max-width:850px;
  margin:auto;
}

.welcome{
  text-align:center;
  margin:14vh auto 30px;
}

.welcome h1{
  font-size:40px;
  margin:0 0 10px;
}

.welcome p{
  color:#8c8694;
}

.msg{
  display:flex;
  align-items:flex-start;
  gap:10px;
  margin:0 0 22px;
  line-height:1.55;
  font-size:15px;
  width:100%;
}

.avatar{
  width:30px;
  height:30px;
  flex:0 0 30px;
  border-radius:9px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#24202a;
  font-size:11px;
}

.user .avatar{
  background:#40374a;
}

.bubble{
  max-width:min(720px,80%);
  min-width:0;
  white-space:pre-wrap;
  overflow-wrap:anywhere;
  padding:2px 0;
}

.user .bubble{
  background:#19161e;
  border:1px solid #302a35;
  border-radius:14px;
  padding:9px 13px;
}

.image-message{
  display:block;
  max-width:280px;
  max-height:280px;
  margin-top:9px;
  border-radius:11px;
  border:1px solid #39323f;
  object-fit:contain;
}

.pdf-card{
  display:flex;
  align-items:center;
  gap:9px;
  margin-top:9px;
  padding:9px 11px;
  background:#17141c;
  border:1px solid #39323f;
  border-radius:11px;
  max-width:300px;
}

.pdf-icon{
  font-size:23px;
}

.pdf-name{
  font-size:12px;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.composer-area{
  position:fixed;
  left:255px;
  right:0;
  bottom:0;
  padding:15px 18px 22px;
  background:linear-gradient(transparent,#09080d 28%);
  z-index:20;
}

.composer{
  max-width:850px;
  margin:auto;
  background:#151219;
  border:1px solid #38313f;
  border-radius:17px;
  padding:8px;
}

.composer-row{
  display:flex;
  align-items:flex-end;
  gap:7px;
}

textarea{
  flex:1;
  min-height:43px;
  max-height:150px;
  padding:9px;
  resize:none;
  border:0;
  outline:0;
  background:transparent;
  color:#fff;
}

.tool,
.send{
  width:42px;
  height:42px;
  flex:0 0 42px;
  border-radius:12px;
  cursor:pointer;
}

.tool{
  border:1px solid #38313f;
  background:#211d27;
  color:#fff;
  font-size:17px;
}

.send{
  border:0;
  background:#fff;
  color:#111;
  font-size:18px;
}

.send:disabled{
  opacity:.35;
}

.attachments{
  display:none;
  gap:7px;
  flex-wrap:wrap;
  padding:5px;
}

.attachment{
  position:relative;
  border:1px solid #39323f;
  border-radius:10px;
  overflow:hidden;
}

.attachment img{
  width:70px;
  height:70px;
  object-fit:cover;
  display:block;
}

.pdf-preview{
  width:170px;
  padding:9px;
  display:flex;
  align-items:center;
  gap:8px;
}

.remove{
  position:absolute;
  right:3px;
  top:3px;
  width:20px;
  height:20px;
  border:0;
  border-radius:50%;
  background:#fff;
  color:#111;
  cursor:pointer;
}

.hint{
  text-align:center;
  color:#65606c;
  font-size:10px;
  margin-top:7px;
}

/* ---------------- LIVE VOICE ---------------- */

.voice-overlay{
  position:fixed;
  inset:0;
  z-index:1000;
  display:none;
  align-items:center;
  justify-content:center;
  background:
    radial-gradient(
      circle at center,
      #21132f 0%,
      #0a090e 42%,
      #040406 100%
    );
  padding:
    env(safe-area-inset-top)
    env(safe-area-inset-right)
    env(safe-area-inset-bottom)
    env(safe-area-inset-left);
}

.voice-overlay.active{
  display:flex;
}

.voice-title{
  position:absolute;
  top:calc(34px + env(safe-area-inset-top));
  font-size:18px;
  font-weight:650;
}

.voice-status{
  position:absolute;
  top:calc(67px + env(safe-area-inset-top));
  color:#a59eae;
  font-size:13px;
}

.globe{
  width:250px;
  height:250px;
  border-radius:50%;
  background:
    radial-gradient(
      circle at 33% 25%,
      #fff 0%,
      #fff 9%,
      #f3e8ff 20%,
      #d6aaff 35%,
      #984cff 52%,
      #6519ad 72%,
      #250633 100%
    );

  box-shadow:
    0 0 28px #d5a2ff,
    0 0 65px #a64dff88,
    inset -28px -25px 50px #21032f,
    inset 18px 15px 40px #ffffffbb;

  will-change:transform,box-shadow;
  animation:float 4s ease-in-out infinite;
}

.globe.listening{
  animation:listen .9s ease-in-out infinite;
  box-shadow:
    0 0 40px #e0b7ff,
    0 0 100px #a94cffaa,
    inset -28px -25px 50px #21032f,
    inset 18px 15px 40px #ffffffcc;
}

.globe.thinking{
  animation:think 1.3s ease-in-out infinite;
}

.globe.speaking{
  animation:speak .65s ease-in-out infinite;
  box-shadow:
    0 0 45px #fff,
    0 0 110px #b967ffcc,
    inset -28px -25px 50px #21032f,
    inset 18px 15px 40px #ffffffdd;
}

@keyframes float{
  0%,100%{
    transform:translateY(0) scale(1);
  }
  50%{
    transform:translateY(-8px) scale(1.015);
  }
}

@keyframes listen{
  0%,100%{
    transform:scale(1);
  }
  50%{
    transform:scale(1.07);
  }
}

@keyframes think{
  0%,100%{
    transform:scale(1) rotate(0deg);
  }
  50%{
    transform:scale(1.035) rotate(3deg);
  }
}

@keyframes speak{
  0%,100%{
    transform:scale(1);
  }
  50%{
    transform:scale(1.09);
  }
}

.voice-controls{
  position:absolute;
  bottom:calc(45px + env(safe-area-inset-bottom));
  display:flex;
  gap:18px;
}

.voice-btn{
  width:58px;
  height:58px;
  border-radius:50%;
  border:1px solid #ffffff25;
  background:#ffffff12;
  color:#fff;
  font-size:22px;
  cursor:pointer;
  backdrop-filter:blur(10px);
}

.voice-btn.mic{
  background:#fff;
  color:#111;
}

.voice-btn.active{
  background:#b967ff;
  color:#fff;
}

/* ---------------- MOBILE ---------------- */

@media(max-width:700px){

  .sidebar{
    display:none;
  }

  .composer-area{
    left:0;
    padding-left:10px;
    padding-right:10px;
    padding-bottom:
      calc(10px + env(safe-area-inset-bottom));
  }

  .topbar{
    padding:0 15px;
  }

  .welcome h1{
    font-size:31px;
  }

  .messages{
    padding-left:12px;
    padding-right:12px;
  }

  .bubble{
    max-width:86%;
  }

  .globe{
    width:215px;
    height:215px;
  }
}

@media(prefers-reduced-motion:reduce){

  .globe{
    animation:none!important;
  }
}
</style>
</head>

<body>

<div class="app">

<aside class="sidebar">

<div class="logo">✦ Ask Anything AI</div>

<button class="new" onclick="newChat()">
＋ New chat
</button>

<div class="history">
<h4>Recent chats</h4>
<div id="history"></div>
</div>

<div class="sidebar-footer">
Your AI assistant
</div>

</aside>

<main>

<header class="topbar">

<div class="model">
Ask Anything <span class="badge">AI</span>
</div>

<div class="badge" id="status">
Connected
</div>

</header>

<section class="messages" id="messages">
<div class="wrap" id="chat"></div>
</section>

<div class="composer-area">

<div class="composer">

<div class="attachments" id="attachments"></div>

<div class="composer-row">

<textarea
id="input"
placeholder="Ask anything…"
rows="1"
></textarea>

<input
id="imageInput"
type="file"
accept="image/*"
multiple
hidden
>

<input
id="pdfInput"
type="file"
accept="application/pdf"
hidden
>

<button
class="tool"
onclick="imageInput.click()"
title="Photo"
>
📷
</button>

<button
class="tool"
onclick="pdfInput.click()"
title="PDF"
>
📄
</button>

<button
class="tool"
onclick="openVoice()"
title="Voice"
>
🎙️
</button>

<button
class="send"
id="send"
onclick="sendMessage()"
>
↑
</button>

</div>

</div>

<div class="hint">
Enter to send · Shift+Enter for new line · 📷 Photo · 📄 PDF · 🎙️ Voice
</div>

</div>

</main>

</div>

<!-- LIVE VOICE -->

<div
class="voice-overlay"
id="voiceOverlay"
>

<div class="voice-title">
Ask Anything AI
</div>

<div
class="voice-status"
id="voiceStatus"
>
Tap the microphone
</div>

<div
class="globe"
id="globe"
></div>

<div class="voice-controls">

<button
class="voice-btn"
onclick="closeVoice()"
aria-label="Close voice mode"
>
×
</button>

<button
class="voice-btn mic"
id="voiceMic"
onclick="toggleLiveVoice()"
aria-label="Start voice assistant"
>
🎙️
</button>

</div>

</div>

<script>
/* =========================================================
   BASIC APP STATE
========================================================= */

const chat =
  document.getElementById("chat");

const messagesBox =
  document.getElementById("messages");

const input =
  document.getElementById("input");

const send =
  document.getElementById("send");

const imageInput =
  document.getElementById("imageInput");

const pdfInput =
  document.getElementById("pdfInput");

const attachments =
  document.getElementById("attachments");

const voiceOverlay =
  document.getElementById("voiceOverlay");

const voiceStatus =
  document.getElementById("voiceStatus");

const globe =
  document.getElementById("globe");

const voiceMic =
  document.getElementById("voiceMic");

const statusBadge =
  document.getElementById("status");

let messages = [];

let chats =
  JSON.parse(
    localStorage.getItem(
      "ask-anything-chats"
    ) || "[]"
  );

let selectedFiles = [];

let normalBusy = false;

/* LIVE AUDIO */

let liveSocket = null;
let liveStream = null;
let liveAudioContext = null;
let liveProcessor = null;
let liveSource = null;

let liveRunning = false;
let liveConnected = false;
let liveClosing = false;

let playbackTime = 0;

let liveSessionToken = null;

const audioQueue = [];

/* =========================================================
   HELPERS
========================================================= */

function escapeHtml(s){
  return String(s).replace(
    /[&<>"']/g,
    m => ({
      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#039;"
    }[m])
  );
}

function scrollBottom(){

  requestAnimationFrame(() => {
    messagesBox.scrollTop =
      messagesBox.scrollHeight;
  });

}

function setGlobe(state){

  globe.classList.remove(
    "listening",
    "thinking",
    "speaking"
  );

  if(state){
    globe.classList.add(state);
  }

}

/* =========================================================
   CHAT
========================================================= */

function newChat(){

  messages = [];
  selectedFiles = [];

  renderAttachments();

  chat.innerHTML = `
    <div class="welcome">
      <h1>What can I help you with?</h1>
      <p>
        Ask anything, upload a photo or PDF,
        or talk with your AI assistant.
      </p>
    </div>
  `;

}

function addMessage(
  role,
  text,
  files=[]
){

  if(
    document.querySelector(".welcome")
  ){
    chat.innerHTML = "";
  }

  const el =
    document.createElement("div");

  el.className =
    "msg " + role;

  const avatar =
    role === "user"
      ? "You"
      : "✦";

  let fileHtml = "";

  for(const file of files){

    if(file.type === "image"){

      fileHtml += `
        <img
          class="image-message"
          src="${file.data}"
        >
      `;

    }else{

      fileHtml += `
        <div class="pdf-card">
          <div class="pdf-icon">📄</div>
          <div class="pdf-name">
            ${escapeHtml(file.name)}
          </div>
        </div>
      `;

    }

  }

  el.innerHTML = `
    <div class="avatar">
      ${avatar}
    </div>

    <div class="bubble">
      ${escapeHtml(text)}
      ${fileHtml}
    </div>
  `;

  chat.appendChild(el);

  scrollBottom();

  return el;
}

/* =========================================================
   FILES
========================================================= */

function fileToDataURL(file){

  return new Promise(
    (resolve,reject) => {

      const reader =
        new FileReader();

      reader.onload =
        () => resolve(reader.result);

      reader.onerror =
        reject;

      reader.readAsDataURL(file);

    }
  );

}

imageInput.onchange =
  async () => {

    for(
      const file of imageInput.files
    ){

      if(
        !file.type.startsWith("image/")
      ){
        continue;
      }

      if(
        file.size >
        10 * 1024 * 1024
      ){

        alert(
          "Image must be under 10 MB."
        );

        continue;
      }

      selectedFiles.push({
        type:"image",
        name:file.name,
        mime:file.type,
        data:
          await fileToDataURL(file)
      });

    }

    imageInput.value = "";

    renderAttachments();

  };

pdfInput.onchange =
  async () => {

    const file =
      pdfInput.files[0];

    if(!file){
      return;
    }

    if(
      file.size >
      20 * 1024 * 1024
    ){

      alert(
        "PDF must be under 20 MB."
      );

      pdfInput.value = "";

      return;
    }

    selectedFiles.push({
      type:"pdf",
      name:file.name,
      mime:"application/pdf",
      data:
        await fileToDataURL(file)
    });

    pdfInput.value = "";

    renderAttachments();

  };

function renderAttachments(){

  if(!selectedFiles.length){

    attachments.style.display =
      "none";

    attachments.innerHTML = "";

    return;
  }

  attachments.style.display =
    "flex";

  attachments.innerHTML =
    selectedFiles
      .map((file,i) => {

        if(file.type === "image"){

          return `
            <div class="attachment">
              <img src="${file.data}">
              <button
                class="remove"
                onclick="removeFile(${i})"
              >
                ×
              </button>
            </div>
          `;

        }

        return `
          <div class="attachment">
            <div class="pdf-preview">
              <span>📄</span>
              <span class="pdf-name">
                ${escapeHtml(file.name)}
              </span>
            </div>

            <button
              class="remove"
              onclick="removeFile(${i})"
            >
              ×
            </button>
          </div>
        `;

      })
      .join("");

}

function removeFile(i){

  selectedFiles.splice(i,1);

  renderAttachments();

}

/* =========================================================
   NORMAL CHAT
========================================================= */

async function sendMessage(){

  const text =
    input.value.trim();

  if(
    (!text && !selectedFiles.length) ||
    normalBusy
  ){
    return;
  }

  normalBusy = true;
  send.disabled = true;

  const files =
    [...selectedFiles];

  input.value = "";
  input.style.height = "auto";

  const content =
    text ||
    "Please analyze the attached file.";

  messages.push({
    role:"user",
    content,
    attachments:files
  });

  addMessage(
    "user",
    content,
    files
  );

  selectedFiles = [];

  renderAttachments();

  const thinking =
    addMessage(
      "assistant",
      ""
    );

  thinking.querySelector(
    ".bubble"
  ).innerHTML =
    `<span style="color:#8d8794">
      Thinking…
    </span>`;

  try{

    const response =
      await fetch(
        "/api/chat",
        {
          method:"POST",
          headers:{
            "Content-Type":
              "application/json"
          },
          body:
            JSON.stringify({
              messages
            })
        }
      );

    const data =
      await response.json();

    if(!response.ok){
      throw new Error(
        data.answer ||
        "AI request failed"
      );
    }

    const answer =
      data.answer ||
      "No answer returned.";

    thinking.querySelector(
      ".bubble"
    ).textContent =
      answer;

    messages.push({
      role:"assistant",
      content:answer
    });

    saveChat(
      content
    );

    statusBadge.textContent =
      "Connected";

  }catch(error){

    console.error(error);

    thinking.querySelector(
      ".bubble"
    ).textContent =
      "Sorry, I couldn't process that right now.";

    statusBadge.textContent =
      "Connection issue";

  }finally{

    normalBusy = false;
    send.disabled = false;

  }

}

/* =========================================================
   VOICE OPEN/CLOSE
========================================================= */

function openVoice(){

  voiceOverlay.classList.add(
    "active"
  );

  voiceStatus.textContent =
    "Tap the microphone";

  setGlobe("");

}

async function closeVoice(){

  await stopLiveVoice();

  voiceOverlay.classList.remove(
    "active"
  );

  setGlobe("");

  voiceStatus.textContent =
    "Tap the microphone";

}

async function toggleLiveVoice(){

  if(liveRunning){

    await stopLiveVoice();

    return;
  }

  await startLiveVoice();

}

/* =========================================================
   LIVE TOKEN
========================================================= */

async function getLiveToken(){

  const response =
    await fetch(
      "/api/live-token",
      {
        method:"POST",
        headers:{
          "Content-Type":
            "application/json"
        },
        body:"{}"
      }
    );

  const data =
    await response.json();

  if(
    !response.ok ||
    !data.token
  ){

    throw new Error(
      data.error ||
      "Could not create voice session."
    );
  }

  return data.token;

}

/* =========================================================
   LIVE AUDIO CONTEXT
========================================================= */

async function createAudioInput(){

  liveAudioContext =
    new (
      window.AudioContext ||
      window.webkitAudioContext
    )({
      sampleRate:16000
    });

  await liveAudioContext.resume();

  liveStream =
    await navigator.mediaDevices.getUserMedia({
      audio:{
        channelCount:1,
        echoCancellation:true,
        noiseSuppression:true,
        autoGainControl:true
      }
    });

  liveSource =
    liveAudioContext.createMediaStreamSource(
      liveStream
    );

  /*
    ScriptProcessor is intentionally used here
    because it has broad Safari + Android support.
  */

  liveProcessor =
    liveAudioContext.createScriptProcessor(
      4096,
      1,
      1
    );

  liveProcessor.onaudioprocess =
    event => {

      if(
        !liveSocket ||
        liveSocket.readyState !==
          WebSocket.OPEN ||
        !liveRunning
      ){
        return;
      }

      const inputData =
        event.inputBuffer.getChannelData(0);

      const pcm =
        floatTo16BitPCM(
          inputData
        );

      const base64 =
        arrayBufferToBase64(
          pcm.buffer
        );

      const message = {
        realtimeInput:{
          audio:{
            mimeType:
              "audio/pcm;rate=16000",
            data:base64
          }
        }
      };

      try{

        liveSocket.send(
          JSON.stringify(message)
        );

      }catch(error){

        console.error(
          "Audio send error:",
          error
        );

      }

    };

  liveSource.connect(
    liveProcessor
  );

  /*
    ScriptProcessorNode must be connected to keep processing
    reliably in Safari, but its output should be silent so
    the microphone is not played back into the speaker.
  */
  const silentGain =
    liveAudioContext.createGain();

  silentGain.gain.value = 0;

  liveProcessor.connect(
    silentGain
  );

  silentGain.connect(
    liveAudioContext.destination
  );

}

/* =========================================================
   PCM HELPERS
========================================================= */

function floatTo16BitPCM(float32){

  const output =
    new Int16Array(
      float32.length
    );

  for(
    let i=0;
    i<float32.length;
    i++
  ){

    const s =
      Math.max(
        -1,
        Math.min(
          1,
          float32[i]
        )
      );

    output[i] =
      s < 0
        ? s * 0x8000
        : s * 0x7fff;

  }

  return output;

}

function arrayBufferToBase64(buffer){

  const bytes =
    new Uint8Array(buffer);

  let binary = "";

  const chunk = 0x8000;

  for(
    let i=0;
    i<bytes.length;
    i+=chunk
  ){

    binary += String.fromCharCode(
      ...bytes.subarray(
        i,
        Math.min(
          i + chunk,
          bytes.length
        )
      )
    );

  }

  return btoa(binary);

}

function base64ToUint8Array(base64){

  const binary =
    atob(base64);

  const bytes =
    new Uint8Array(
      binary.length
    );

  for(
    let i=0;
    i<binary.length;
    i++
  ){

    bytes[i] =
      binary.charCodeAt(i);

  }

  return bytes;

}

/* =========================================================
   LIVE AUDIO PLAYBACK
========================================================= */

async function setupPlayback(){

  if(!liveAudioContext){

    liveAudioContext =
      new (
        window.AudioContext ||
        window.webkitAudioContext
      )();

  }

  await liveAudioContext.resume();

  playbackTime =
    Math.max(
      playbackTime,
      liveAudioContext.currentTime
    );

}

function pcm16ToFloat32(
  bytes
){

  const view =
    new DataView(
      bytes.buffer,
      bytes.byteOffset,
      bytes.byteLength
    );

  const samples =
    Math.floor(
      bytes.byteLength / 2
    );

  const float32 =
    new Float32Array(
      samples
    );

  for(
    let i=0;
    i<samples;
    i++
  ){

    const sample =
      view.getInt16(
        i * 2,
        true
      );

    float32[i] =
      sample / 32768;

  }

  return float32;

}

async function playPCM24k(
  base64
){

  if(!liveAudioContext){
    return;
  }

  await liveAudioContext.resume();

  const bytes =
    base64ToUint8Array(
      base64
    );

  if(!bytes.length){
    return;
  }

  const samples =
    pcm16ToFloat32(
      bytes
    );

  const buffer =
    liveAudioContext.createBuffer(
      1,
      samples.length,
      24000
    );

  buffer.copyToChannel(
    samples,
    0
  );

  const source =
    liveAudioContext.createBufferSource();

  source.buffer =
    buffer;

  source.connect(
    liveAudioContext.destination
  );

  const now =
    liveAudioContext.currentTime;

  playbackTime =
    Math.max(
      playbackTime,
      now
    );

  source.start(
    playbackTime
  );

  playbackTime +=
    buffer.duration;

  setGlobe("speaking");

  voiceStatus.textContent =
    "Speaking…";

}

/* =========================================================
   GEMINI LIVE WEBSOCKET
========================================================= */

async function startLiveVoice(){

  if(
    !navigator.mediaDevices ||
    !navigator.mediaDevices.getUserMedia
  ){

    voiceStatus.textContent =
      "Microphone isn't available.";

    return;
  }

  if(
    liveRunning ||
    liveConnected
  ){
    return;
  }

  liveClosing = false;

  try{

    /*
      This happens from the user's tap,
      which is important for iOS audio.
    */

    liveAudioContext =
      new (
        window.AudioContext ||
        window.webkitAudioContext
      )();

    await liveAudioContext.resume();

    voiceStatus.textContent =
      "Connecting…";

    setGlobe("thinking");

    liveSessionToken =
      await getLiveToken();

    const socketUrl =
      "wss://generativelanguage.googleapis.com/ws/google.ai.generativelanguage.v1beta.GenerativeService.BidiGenerateContentConstrained?access_token=" +
      encodeURIComponent(
        liveSessionToken
      );

    liveSocket =
      new WebSocket(
        socketUrl
      );

    liveSocket.binaryType =
      "arraybuffer";

    liveSocket.onopen =
      async () => {

        if(liveClosing){
          return;
        }

        const setup = {
          setup:{
            model:
              "models/gemini-3.8-live",

            generationConfig:{
              responseModalities:[
                "AUDIO"
              ]
            },

            systemInstruction:{
              parts:[
                {
                  text:
                    `
You are the voice assistant for Ask Anything AI.

Speak naturally and clearly.

Be accurate.
Never invent information.
If you are uncertain, say so.
Answer directly without unnecessary introductions.
Keep responses reasonably concise for voice conversation.
`
                }
              ]
            },

            /*
              Keep the first setup message minimal for maximum
              Safari/Android compatibility. We can add
              transcription and session resumption after the
              basic audio session is working.
            */
          }
        };

        liveSocket.send(
          JSON.stringify(setup)
        );

        liveConnected = true;

        /*
          Do not start sending microphone audio until
          Gemini confirms that the Live setup is complete.
          This is especially important for Safari.
        */

        voiceStatus.textContent =
          "Connecting…";

        setGlobe("thinking");

      };

    liveSocket.onmessage =
      async event => {

        try{

          const response =
            JSON.parse(
              event.data
            );

          /*
            Gemini confirms the Live configuration with
            setupComplete. Only then do we start the
            microphone stream.
          */
          if(response.setupComplete){

            liveRunning = true;

            voiceMic.classList.add(
              "active"
            );

            voiceStatus.textContent =
              "Listening…";

            setGlobe("listening");

            try{

              await createAudioInput();

            }catch(error){

              console.error(
                "Microphone error:",
                error
              );

              voiceStatus.textContent =
                "Microphone permission required.";

              await stopLiveVoice();

            }

            return;
          }

          if(response.error){

            console.error(
              "Gemini Live error:",
              response.error
            );

            const errorMessage =
              response.error.message ||
              response.error.status ||
              "Voice connection error.";

            voiceStatus.textContent =
              errorMessage;

            setGlobe("");

            return;
          }

          const serverContent =
            response.serverContent;

          if(!serverContent){
            return;
          }

          if(
            serverContent.interrupted
          ){

            stopQueuedPlayback();

            voiceStatus.textContent =
              "Listening…";

            setGlobe(
              "listening"
            );

            return;
          }

          const modelTurn =
            serverContent.modelTurn;

          if(modelTurn?.parts){

            for(
              const part
              of modelTurn.parts
            ){

              const audio =
                part.inlineData ||
                part.inline_data;

              if(
                audio &&
                audio.data
              ){

                await playPCM24k(
                  audio.data
                );

              }

            }

          }

          if(
            serverContent.turnComplete
          ){

            if(
              !playbackIsActive()
            ){

              voiceStatus.textContent =
                "Listening…";

              setGlobe(
                "listening"
              );

            }

          }

        }catch(error){

          console.error(
            "Live message error:",
            error
          );

        }

      };

    liveSocket.onerror =
      error => {

        console.error(
          "Live socket error:",
          error
        );

        voiceStatus.textContent =
          "Voice connection error.";

      };

    liveSocket.onclose =
      event => {

        console.log(
          "Live socket closed:",
          event.code,
          event.reason
        );

        liveConnected = false;
        liveRunning = false;

        voiceMic.classList.remove(
          "active"
        );

        if(!liveClosing){

          const reason =
            event.reason
              ? " — " + event.reason
              : "";

          voiceStatus.textContent =
            "Connection closed (" +
            event.code +
            ")" +
            reason;

          console.error(
            "Gemini Live closed. Code:",
            event.code,
            "Reason:",
            event.reason || "(none)"
          );

          setGlobe("");

        }

      };

  }catch(error){

    console.error(
      "Start voice error:",
      error
    );

    voiceStatus.textContent =
      error.message ||
      "Couldn't start voice mode.";

    setGlobe("");

    await stopLiveVoice();

  }

}

/* =========================================================
   PLAYBACK STATE
========================================================= */

function playbackIsActive(){

  if(!liveAudioContext){
    return false;
  }

  return (
    playbackTime >
    liveAudioContext.currentTime + 0.05
  );

}

function stopQueuedPlayback(){

  playbackTime =
    liveAudioContext
      ? liveAudioContext.currentTime
      : 0;

}

/* =========================================================
   STOP LIVE VOICE
========================================================= */

async function stopLiveVoice(){

  liveClosing = true;
  liveRunning = false;
  liveConnected = false;

  voiceMic.classList.remove(
    "active"
  );

  if(liveProcessor){

    try{
      liveProcessor.disconnect();
    }catch(e){}

    liveProcessor.onaudioprocess =
      null;

    liveProcessor = null;

  }

  if(liveSource){

    try{
      liveSource.disconnect();
    }catch(e){}

    liveSource = null;

  }

  if(liveStream){

    for(
      const track
      of liveStream.getTracks()
    ){

      track.stop();

    }

    liveStream = null;

  }

  if(liveSocket){

    try{

      if(
        liveSocket.readyState ===
        WebSocket.OPEN
      ){

        liveSocket.close(
          1000,
          "User closed voice mode"
        );

      }

    }catch(e){}

    liveSocket = null;

  }

  if(liveAudioContext){

    try{
      await liveAudioContext.close();
    }catch(e){}

    liveAudioContext = null;

  }

  playbackTime = 0;

  setGlobe("");

  liveSessionToken = null;

}

/* =========================================================
   HISTORY
========================================================= */

function saveChat(title){

  if(!messages.length){
    return;
  }

  const clean =
    messages.map(m => ({
      role:m.role,
      content:m.content
    }));

  chats.push({
    title:String(title).slice(0,42),
    messages:clean
  });

  chats =
    chats.slice(-20);

  localStorage.setItem(
    "ask-anything-chats",
    JSON.stringify(chats)
  );

  renderHistory();

}

function renderHistory(){

  const history =
    document.getElementById(
      "history"
    );

  history.innerHTML =
    chats
      .slice(-12)
      .reverse()
      .map(
        (x,i) => `
          <div
            class="chat-item"
            onclick="loadChat(${chats.length - 1 - i})"
          >
            ${escapeHtml(x.title)}
          </div>
        `
      )
      .join("");

}

function loadChat(i){

  const c =
    chats[i];

  if(!c){
    return;
  }

  messages =
    c.messages || [];

  chat.innerHTML = "";

  for(
    const m
    of messages
  ){

    addMessage(
      m.role,
      m.content
    );

  }

}

/* =========================================================
   INPUT
========================================================= */

input.addEventListener(
  "keydown",
  event => {

    if(
      event.key === "Enter" &&
      !event.shiftKey
    ){

      event.preventDefault();

      sendMessage();

    }

  }
);

input.addEventListener(
  "input",
  () => {

    input.style.height =
      "auto";

    input.style.height =
      Math.min(
        input.scrollHeight,
        150
      ) + "px";

  }
);

/* =========================================================
   START
========================================================= */

renderHistory();

newChat();

</script>
