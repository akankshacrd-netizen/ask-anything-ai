<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ask Anything AI</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:#0b0d10;
  color:#f4f4f5;
  height:100vh;
  overflow:hidden
}

.app{display:flex;height:100vh}

.sidebar{
  width:270px;
  background:#111318;
  border-right:1px solid #252932;
  padding:18px;
  display:flex;
  flex-direction:column;
  gap:16px
}

.logo{font-size:20px;font-weight:750;padding:8px 4px}

.new{
  border:1px solid #30343d;
  background:#191c22;
  color:#fff;
  border-radius:12px;
  padding:12px 14px;
  font-size:14px;
  cursor:pointer;
  text-align:left
}

.new:hover{background:#20242b}

.history{flex:1;overflow:auto}

.history h4{
  color:#8e949f;
  font-size:11px;
  text-transform:uppercase;
  letter-spacing:.08em;
  margin:12px 5px
}

.chat-item{
  padding:10px;
  border-radius:9px;
  color:#cfd2d8;
  font-size:13px;
  cursor:pointer;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis
}

.chat-item:hover{background:#1b1e24}

.sidebar-footer{
  font-size:12px;
  color:#777e89;
  padding:4px
}

main{
  flex:1;
  display:flex;
  flex-direction:column;
  min-width:0
}

.topbar{
  height:60px;
  border-bottom:1px solid #252932;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 24px;
  background:#0d0f13
}

.model{font-weight:650}

.badge{
  font-size:11px;
  color:#9aa1ad;
  border:1px solid #30343d;
  border-radius:999px;
  padding:5px 9px
}

.messages{
  flex:1;
  overflow:auto;
  padding:30px 16px 150px
}

.wrap{max-width:850px;margin:auto}

.welcome{
  text-align:center;
  margin:13vh auto 30px
}

.welcome h1{
  font-size:42px;
  margin:0 0 12px;
  letter-spacing:-.04em
}

.welcome p{color:#8e949f;font-size:16px}

.msg{
  display:flex;
  gap:13px;
  margin:0 auto 25px;
  line-height:1.65;
  font-size:15px
}

.avatar{
  width:30px;
  height:30px;
  border-radius:9px;
  background:#22262e;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:13px;
  flex:0 0 auto
}

.user .avatar{background:#394150}

.bubble{
  max-width:760px;
  white-space:pre-wrap;
  word-wrap:break-word
}

.user .bubble{
  background:#171a20;
  border:1px solid #292e37;
  padding:10px 13px;
  border-radius:13px
}

.image-message{
  margin-top:8px;
  max-width:300px;
  max-height:300px;
  border-radius:12px;
  border:1px solid #343943;
  display:block
}

.voice-button{
  margin-top:8px;
  border:1px solid #343943;
  background:#20242b;
  color:#fff;
  border-radius:9px;
  padding:6px 10px;
  cursor:pointer;
  font-size:12px
}

.voice-button:hover{background:#292e37}

.composer-area{
  position:fixed;
  bottom:0;
  left:270px;
  right:0;
  padding:18px 20px 24px;
  background:linear-gradient(transparent,#0b0d10 25%)
}

.composer{
  max-width:850px;
  margin:auto;
  background:#15181e;
  border:1px solid #343943;
  border-radius:17px;
  padding:9px 10px;
  box-shadow:0 8px 35px #0008
}

.composer-row{
  display:flex;
  align-items:flex-end
}

.composer textarea{
  flex:1;
  background:transparent;
  border:0;
  outline:0;
  color:#fff;
  resize:none;
  min-height:45px;
  max-height:180px;
  padding:9px;
  font:inherit
}

.send{
  width:42px;
  height:42px;
  border:0;
  border-radius:12px;
  background:#fff;
  color:#111;
  cursor:pointer;
  font-size:18px
}

.send:disabled{
  opacity:.35;
  cursor:not-allowed
}

.action-button{
  width:42px;
  height:42px;
  border:1px solid #343943;
  border-radius:12px;
  background:#20242b;
  color:#fff;
  cursor:pointer;
  font-size:18px;
  margin-right:7px
}

.action-button:hover{background:#292e37}

.mic-active{
  background:#ffffff;
  color:#111;
}

.photo-preview{
  display:none;
  padding:8px 8px 4px;
  position:relative
}

.photo-preview img{
  width:90px;
  height:90px;
  object-fit:cover;
  border-radius:12px;
  border:1px solid #343943
}

.remove-photo{
  position:absolute;
  left:85px;
  top:2px;
  width:24px;
  height:24px;
  border:0;
  border-radius:50%;
  background:#fff;
  color:#111;
  cursor:pointer;
  font-weight:bold
}

.hint{
  text-align:center;
  color:#666d77;
  font-size:11px;
  margin-top:8px
}

.typing{color:#8e949f}

.dot{animation:blink 1s infinite}
.dot:nth-child(2){animation-delay:.2s}
.dot:nth-child(3){animation-delay:.4s}

@keyframes blink{
  50%{opacity:.2}
}

@media(max-width:700px){
  .sidebar{display:none}
  .composer-area{left:0}
  .topbar{padding:0 16px}
  .welcome h1{font-size:32px}
  .messages{padding-left:12px;padding-right:12px}
}
</style>
</head>

<body>

<div class="app">

<aside class="sidebar">

  <div class="logo">✦ Ask Anything AI</div>

  <button class="new" onclick="newChat()">＋ New chat</button>

  <div class="history">
    <h4>Recent chats</h4>
    <div id="history"></div>
  </div>

  <div class="sidebar-footer">
    Your AI assistant · Voice · Vision
  </div>

</aside>

<main>

  <header class="topbar">
    <div class="model">
      Ask Anything <span class="badge">AI</span>
    </div>

    <div class="badge" id="status">
      Connected
    </div>
  </header>

  <section class="messages" id="messages">
    <div class="wrap" id="chat"></div>
  </section>

  <div class="composer-area">

    <div class="composer">

      <div class="photo-preview" id="photoPreview">
        <img id="previewImage" alt="Selected photo">
        <button class="remove-photo" onclick="removePhoto()">×</button>
      </div>

      <div class="composer-row">

        <textarea
          id="input"
          rows="1"
          placeholder="Ask anything…"
        ></textarea>

        <input
          id="imageInput"
          type="file"
          accept="image/*"
          style="display:none"
          onchange="handleImage(event)"
        >

        <button
          type="button"
          class="action-button"
          id="micButton"
          onclick="toggleMic()"
          title="Speak"
        >
          🎙️
        </button>

        <button
          type="button"
          class="action-button"
          onclick="document.getElementById('imageInput').click()"
          title="Upload photo"
        >
          📷
        </button>

        <button
          class="send"
          id="send"
          onclick="sendMessage()"
        >
          ↑
        </button>

      </div>

    </div>

    <div class="hint">
      🎙️ Speak · 📷 Upload photo · Enter to send · Shift+Enter for new line
    </div>

  </div>

</main>

</div>

<script>

const chat = document.getElementById('chat');
const input = document.getElementById('input');
const send = document.getElementById('send');
const imageInput = document.getElementById('imageInput');
const photoPreview = document.getElementById('photoPreview');
const previewImage = document.getElementById('previewImage');
const micButton = document.getElementById('micButton');

let messages = [];

let chats = JSON.parse(
  localStorage.getItem('ask-anything-chats') || '[]'
);

let selectedImage = null;
let recognition = null;
let isListening = false;


/* -------------------------
   HISTORY
------------------------- */

function renderHistory(){

  document.getElementById('history').innerHTML =
    chats
      .slice(-12)
      .reverse()
      .map((x,i)=>
        `<div class="chat-item"
        onclick="loadChat(${chats.length-1-i})">
        ${escapeHtml(x.title)}
        </div>`
      )
      .join('');
}


/* -------------------------
   SECURITY
------------------------- */

function escapeHtml(s){

  return String(s).replace(
    /[&<>"']/g,
    m => ({
      '&':'&amp;',
      '<':'&lt;',
      '>':'&gt;',
      '"':'&quot;',
      "'":'&#039;'
    }[m])
  );

}


/* -------------------------
   NEW CHAT
------------------------- */

function newChat(){

  messages = [];

  selectedImage = null;

  stopSpeaking();

  removePhoto();

  chat.innerHTML = `
    <div class="welcome">
      <h1>What can I help you with?</h1>
      <p>
        Ask questions, speak naturally, or upload a photo for help.
      </p>
    </div>
  `;

}


/* -------------------------
   IMAGE UPLOAD
------------------------- */

function handleImage(event){

  const file = event.target.files[0];

  if(!file) return;

  if(!file.type.startsWith('image/')){

    alert('Please select an image.');

    return;
  }

  if(file.size > 10 * 1024 * 1024){

    alert('Please choose an image smaller than 10 MB.');

    imageInput.value = '';

    return;
  }

  const reader = new FileReader();

  reader.onload = function(e){

    selectedImage = e.target.result;

    previewImage.src = selectedImage;

    photoPreview.style.display = 'block';

  };

  reader.readAsDataURL(file);

}


/* -------------------------
   REMOVE IMAGE
------------------------- */

function removePhoto(){

  selectedImage = null;

  previewImage.src = '';

  photoPreview.style.display = 'none';

  imageInput.value = '';

}


/* -------------------------
   VOICE INPUT
------------------------- */

function setupSpeechRecognition(){

  const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

  if(!SpeechRecognition){

    micButton.title =
      'Speech recognition is not supported in this browser';

    return;
  }

  recognition = new SpeechRecognition();

  recognition.continuous = false;

  recognition.interimResults = true;

  recognition.lang = 'en-IN';

  recognition.onstart = function(){

    isListening = true;

    micButton.classList.add('mic-active');

    micButton.textContent = '⏹️';

    document.getElementById('status').textContent =
      'Listening...';

  };

  recognition.onresult = function(event){

    let transcript = '';

    for(
      let i = event.resultIndex;
      i < event.results.length;
      i++
    ){

      transcript +=
        event.results[i][0].transcript;

    }

    input.value = transcript;

    input.style.height = 'auto';

    input.style.height =
      Math.min(input.scrollHeight,180) + 'px';

  };

  recognition.onerror = function(event){

    console.error('Speech recognition error:',event.error);

    document.getElementById('status').textContent =
      'Voice error';

    stopMic();

  };

  recognition.onend = function(){

    stopMic();

    document.getElementById('status').textContent =
      'Connected';

  };

}


function toggleMic(){

  if(!recognition){

    alert(
      'Voice input is not supported by this browser. Try Chrome or Android Chrome.'
    );

    return;
  }

  if(isListening){

    recognition.stop();

  }else{

    try{

      recognition.start();

    }catch(error){

      console.error(error);

    }

  }

}


function stopMic(){

  isListening = false;

  micButton.classList.remove('mic-active');

  micButton.textContent = '🎙️';

}


/* -------------------------
   VOICE OUTPUT
------------------------- */

function speakText(text,button){

  if(!('speechSynthesis' in window)){

    alert(
      'Voice output is not supported by this browser.'
    );

    return;
  }

  speechSynthesis.cancel();

  if(button){

    button.textContent = '⏹️ Stop';

  }

  const utterance =
    new SpeechSynthesisUtterance(text);

  utterance.lang = 'en-IN';

  utterance.rate = 1;

  utterance.pitch = 1;

  utterance.onend = function(){

    if(button){

      button.textContent = '🔊 Listen';

    }

  };

  utterance.onerror = function(){

    if(button){

      button.textContent = '🔊 Listen';

    }

  };

  speechSynthesis.speak(utterance);

}


function stopSpeaking(){

  if('speechSynthesis' in window){

    speechSynthesis.cancel();

  }

  document
    .querySelectorAll('.voice-button')
    .forEach(button => {

      button.textContent = '🔊 Listen';

    });

}


/* -------------------------
   ADD MESSAGE
------------------------- */

function addMessage(role,text,image=null){

  if(document.querySelector('.welcome')){

    chat.innerHTML='';

  }

  const el = document.createElement('div');

  el.className = 'msg ' + role;

  let imageHtml = '';

  if(image){

    imageHtml =
      `<img class="image-message"
      src="${image}"
      alt="Uploaded photo">`;

  }

  let voiceHtml = '';

  if(role === 'assistant'){

    const voiceId =
      'voice-' + Date.now() + '-' +
      Math.random().toString(36).slice(2);

    voiceHtml =
      `<button
        class="voice-button"
        id="${voiceId}"
        onclick="speakText(
          ${JSON.stringify(text).replace(/</g,'\\u003c')},
          this
        )">
        🔊 Listen
      </button>`;

  }

  el.innerHTML = `
    <div class="avatar">
      ${role === 'user' ? 'You' : '✦'}
    </div>

    <div class="bubble">
      ${escapeHtml(text)}
      ${imageHtml}
      ${voiceHtml}
    </div>
  `;

  chat.appendChild(el);

  document.getElementById('messages').scrollTop =
    999999;

}


/* -------------------------
   SEND MESSAGE
------------------------- */

async function sendMessage(){

  const text = input.value.trim();

  if(
    (!text && !selectedImage) ||
    send.disabled
  ) return;

  stopSpeaking();

  const imageToSend = selectedImage;

  input.value = '';

  input.style.height = 'auto';

  const userMessage = {

    role:'user',

    content:
      text || 'Please analyze this image.',

    image:
      imageToSend || null

  };

  messages.push(userMessage);

  addMessage(
    'user',
    userMessage.content,
    imageToSend
  );

  removePhoto();

  send.disabled = true;

  const typing =
    document.createElement('div');

  typing.className =
    'msg assistant';

  typing.innerHTML = `
    <div class="avatar">✦</div>

    <div class="bubble typing">
      Thinking
      <span class="dot">•</span>
      <span class="dot">•</span>
      <span class="dot">•</span>
    </div>
  `;

  chat.appendChild(typing);

  document
    .getElementById('messages')
    .scrollTop = 999999;

  try{

    const r = await fetch(
      '/api/chat',
      {
        method:'POST',

        headers:{
          'Content-Type':
            'application/json'
        },

        body:JSON.stringify({
          messages:messages
        })

      }
    );

    if(!r.ok){

      throw new Error(
        'Backend error'
      );

    }

    const data =
      await r.json();

    typing.remove();

    const answer =
      data.answer ||
      'No answer returned.';

    messages.push({

      role:'assistant',

      content:answer

    });

    addMessage(
      'assistant',
      answer
    );

    saveChat(
      text || 'Photo question'
    );

    document
      .getElementById('status')
      .textContent =
      'Connected';

  }

  catch(e){

    typing.remove();

    const errorMessage =
      'Sorry, I could not process your request right now.';

    messages.push({

      role:'assistant',

      content:errorMessage

    });

    addMessage(
      'assistant',
      errorMessage
    );

    document
      .getElementById('status')
      .textContent =
      'Connection error';

    console.error(e);

  }

  send.disabled = false;

  input.focus();

}


/* -------------------------
   SAVE CHAT
------------------------- */

function saveChat(first){

  if(!messages.length)
    return;

  chats.push({

    title:first.slice(0,42),

    messages:messages

  });

  chats =
    chats.slice(-20);

  localStorage.setItem(
    'ask-anything-chats',
    JSON.stringify(chats)
  );

  renderHistory();

}


/* -------------------------
   LOAD CHAT
------------------------- */

function loadChat(i){

  const c = chats[i];

  if(!c) return;

  messages =
    c.messages || [];

  chat.innerHTML = '';

  messages.forEach(m => {

    addMessage(

      m.role === 'user'
        ? 'user'
        : 'assistant',

      m.content,

      m.image || null

    );

  });

}


/* -------------------------
   ENTER TO SEND
------------------------- */

input.addEventListener(
  'keydown',
  e => {

    if(
      e.key === 'Enter' &&
      !e.shiftKey
    ){

      e.preventDefault();

      sendMessage();

    }

  }
);


/* -------------------------
   AUTO RESIZE
------------------------- */

input.addEventListener(
  'input',
  () => {

    input.style.height =
      'auto';

    input.style.height =
      Math.min(
        input.scrollHeight,
        180
      ) + 'px';

  }
);


/* -------------------------
   START
------------------------- */

setupSpeechRecognition();

renderHistory();

newChat();

</script>

</body>
</html>
